  <!-- footer counts -->
  <circle cx="12" cy="186" r="2" fill="#f5a524"/>
  <circle cx="26" cy="186" r="2" fill="#4ade80"/>
  <circle cx="40" cy="186" r="2" fill="#60a5fa"/>
  <!-- top bar -->
  <rect x="78" y="0" width="242" height="22" fill="#262b31"/>
  <rect x="86" y="6" width="70" height="10" rx="3" fill="#323840"/>
  <g fill="#f1ede4" opacity="0.55">
    <rect x="216" y="8" width="6" height="6" rx="1.5"/><rect x="226" y="8" width="6" height="6" rx="1.5"/><rect x="236" y="8" width="6" height="6" rx="1.5"/>
    <rect x="256" y="8" width="12" height="6" rx="1.5"/><rect x="272" y="8" width="12" height="6" rx="1.5"/><rect x="288" y="8" width="12" height="6" rx="1.5"/><rect x="304" y="8" width="10" height="6" rx="1.5"/>
  </g>
  <!-- terminal -->
  <rect x="84" y="28" width="150" height="166" rx="5" fill="#16191d" stroke="#323840"/>
  <g fill="#4ade80" opacity="0.7"><rect x="92" y="38" width="40" height="3" rx="1.5"/></g>
  <g fill="#f1ede4" opacity="0.35">
    <rect x="92" y="46" width="90" height="3" rx="1.5"/><rect x="92" y="54" width="70" height="3" rx="1.5"/><rect x="92" y="62" width="110" height="3" rx="1.5"/>
