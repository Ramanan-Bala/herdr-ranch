    <rect x="246" y="44" width="62" height="3" rx="1.5" fill="#323840"/>
    <rect x="246" y="44" width="38" height="3" rx="1.5" fill="#4ade80" opacity="0.8"/>
    <rect x="246" y="53" width="54" height="3" rx="1.5" opacity="0.6"/>
    <rect x="246" y="60" width="48" height="3" rx="1.5" opacity="0.4"/>
    <rect x="246" y="67" width="40" height="3" rx="1.5" opacity="0.3"/>
    <rect x="246" y="82" width="24" height="3" rx="1.5" opacity="0.5"/>
    <rect x="246" y="90" width="50" height="3" rx="1.5" opacity="0.4"/>
    <rect x="246" y="97" width="44" height="3" rx="1.5" opacity="0.35"/>
