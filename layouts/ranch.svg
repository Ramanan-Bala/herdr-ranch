    <rect x="12" y="79" width="18" height="3" rx="1.5" opacity="0.25"/>
    <rect x="8" y="90" width="62" height="26" rx="4" fill="#2b3036"/>
    <rect x="12" y="95" width="30" height="3" rx="1.5" opacity="0.6"/>
    <circle cx="64" cy="96.5" r="2" fill="#60a5fa"/>
    <rect x="12" y="102" width="26" height="3" rx="1.5" opacity="0.35"/>
