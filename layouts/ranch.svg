<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <title>Ranch layout</title>
  <rect width="320" height="200" rx="8" fill="#1f2328"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="78" height="200" rx="8" fill="#262b31"/>
  <rect x="8" y="9" width="10" height="10" rx="2.5" fill="#d4532b"/>
  <rect x="22" y="12" width="26" height="4" rx="2" fill="#f1ede4" opacity="0.85"/>
  <!-- session cards -->
  <g fill="#f1ede4">
    <rect x="8" y="30" width="62" height="26" rx="4" fill="#323840"/>
    <rect x="12" y="35" width="28" height="3" rx="1.5" opacity="0.8"/>
    <circle cx="64" cy="36.5" r="2" fill="#4ade80"/>
    <rect x="12" y="42" width="34" height="3" rx="1.5" opacity="0.45"/>
    <rect x="12" y="49" width="22" height="3" rx="1.5" opacity="0.3"/>
    <rect x="8" y="60" width="62" height="26" rx="4" fill="#2b3036"/>
    <rect x="12" y="65" width="24" height="3" rx="1.5" opacity="0.6"/>
    <circle cx="64" cy="66.5" r="2" fill="#f5a524"/>
